[project]
name = "opentavus-api"
version = "0.1.0a1"
description = "Loopback API and CLI for the OpenTavus local companion alpha"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["opentavus-runtime", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
opentavus = "opentavus_api.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
opentavus-runtime = { workspace = true }
