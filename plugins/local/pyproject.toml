[project]
name = "opentavus-local"
version = "0.1.0a1"
description = "Optional local Whisper, Kokoro, and Ollama adapters"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = ["opentavus-core", "httpx>=0.28,<1"]

[project.optional-dependencies]
stt = ["faster-whisper==1.2.1"]
tts = ["kokoro-onnx==0.6.1"]

[project.entry-points."opentavus.manifests"]
"local.whisper" = "opentavus_whisper"
"local.kokoro" = "opentavus_kokoro"
"local.ollama" = "opentavus_ollama"

[project.entry-points."opentavus.engines"]
"local.whisper" = "opentavus_whisper.adapter:create"
"local.kokoro" = "opentavus_kokoro.adapter:create"
"local.ollama" = "opentavus_ollama.adapter:create"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentavus_whisper", "src/opentavus_kokoro", "src/opentavus_ollama"]

[tool.uv.sources]
opentavus-core = { workspace = true }
