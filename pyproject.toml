[project]
name = "opentavus-workspace"
version = "0.0.1"
description = "OpenTavus development workspace"
requires-python = ">=3.11,<3.15"
dependencies = ["opentavus-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/runtime", "apps/api", "plugins/fixtures/demo", "plugins/local"]

[tool.uv.sources]
opentavus-core = { workspace = true }
opentavus-fixture-demo = { workspace = true }
opentavus-api = { workspace = true }
opentavus-runtime = { workspace = true }
opentavus-local = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4,<5"]
fixtures = ["opentavus-fixture-demo"]
app = ["opentavus-api"]
models = ["pipecat-ai[webrtc]==1.12.0", "opentavus-local[stt,tts]"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Markdown row templates in the plan verifier intentionally keep long literals.
"scripts/plan.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/core/src", "plugins/fixtures/demo/src", "packages/runtime/src", "apps/api/src", "plugins/local/src"]

[[tool.mypy.overrides]]
module = ["pipecat.*", "kokoro_onnx.*", "faster_whisper.*", "numpy.*", "onnxruntime.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/runtime/tests", "apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["installed_fixture: requires the optional synthetic demo package"]
