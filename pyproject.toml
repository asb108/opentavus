[project]
name = "opentavus-workspace"
version = "0.0.1"
description = "OpenTavus development workspace"
requires-python = ">=3.11,<3.15"
dependencies = ["opentavus-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "plugins/fixtures/demo"]

[tool.uv.sources]
opentavus-core = { workspace = true }
opentavus-fixture-demo = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4,<5"]
fixtures = ["opentavus-fixture-demo"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/core/src", "plugins/fixtures/demo/src"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["installed_fixture: requires the optional synthetic demo package"]
