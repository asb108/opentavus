name: Application and contribution checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the tested uv version
        run: python -m pip install uv==0.7.1
      - name: Install locked application development dependencies without models
        run: make setup
      - name: Verify API, runtime, browser, contracts, and plan
        run: make check
      - name: Exercise installed fixture discovery
        run: make demo
      - name: Verify base with optional plugins absent
        run: make base-check
